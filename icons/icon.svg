<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdeaee"/>
      <stop offset="100%" stop-color="#fbeee0"/>
    </linearGradient>
    <linearGradient id="strip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#fdf6ee"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- film strip -->
  <g transform="translate(176 60) rotate(-6 80 196)">
    <rect width="160" height="392" rx="14" fill="url(#strip)" stroke="#f5b7c2" stroke-width="3"/>
    <rect x="14" y="18"  width="132" height="84" rx="6" fill="#f5b7c2"/>
    <rect x="14" y="110" width="132" height="84" rx="6" fill="#d98b9a"/>
    <rect x="14" y="202" width="132" height="84" rx="6" fill="#fbd5dc"/>
    <rect x="14" y="294" width="132" height="84" rx="6" fill="#b56a78"/>
  </g>
  <!-- sparkle -->
  <text x="256" y="478" text-anchor="middle" font-family="Georgia, serif" font-size="58" fill="#b56a78" font-style="italic">filmae</text>
  <circle cx="412" cy="118" r="6" fill="#d98b9a"/>
  <circle cx="98"  cy="92"  r="4" fill="#d98b9a"/>
  <circle cx="120" cy="402" r="5" fill="#d98b9a"/>
</svg>
