<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#fbe9ec" />
  <meta name="description" content="filmae — a vintage photobooth PWA for soft, nostalgic 4-strip film memories." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="filmae" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>filmae — vintage booth</title>
</head>
<body>
  <!-- Splash / brand bar -->
  <header class="brand-bar">
    <div class="brand">
      <span class="brand-mark">✦</span>
      <h1 class="brand-name">filmae</h1>
      <span class="brand-sub">vintage booth</span>
    </div>
    <button class="icon-btn" id="galleryBtn" aria-label="Open gallery">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="14" rx="3"/>
        <circle cx="9" cy="11" r="2"/>
        <path d="M21 17l-5-5-9 9"/>
      </svg>
    </button>
  </header>

  <main id="app">
    <!-- ============ CAMERA SCREEN ============ -->
    <section class="screen screen--camera active" id="cameraScreen" aria-label="Camera">
      <div class="viewfinder">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlayCanvas" class="overlay-canvas" aria-hidden="true"></canvas>

        <!-- countdown number overlay -->
        <div class="countdown" id="countdown" aria-live="polite"></div>

        <!-- shot counter -->
        <div class="shot-counter" id="shotCounter">1 / 4</div>

        <!-- flash overlay -->
        <div class="flash" id="flash"></div>

        <!-- mini thumbs (last shots) -->
        <div class="shot-thumbs" id="shotThumbs"></div>
      </div>

      <!-- preset chips -->
      <div class="presets" id="presets" role="tablist" aria-label="Film presets">
        <button class="chip active" role="tab" data-preset="warm">Warm Film</button>
        <button class="chip" role="tab" data-preset="pink">Soft Pink</button>
        <button class="chip" role="tab" data-preset="cool">Cool Fade</button>
        <button class="chip" role="tab" data-preset="washed">Washed Memory</button>
        <button class="chip" role="tab" data-preset="bw">B&amp;W</button>
      </div>

      <!-- controls row -->
      <div class="controls">
        <button class="ctl-btn" id="timerBtn" aria-label="Timer">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="13" r="8"/>
            <path d="M12 9v4l2 2"/>
            <path d="M9 2h6"/>
          </svg>
          <span id="timerLabel">3s</span>
        </button>

        <button class="shutter" id="shutterBtn" aria-label="Capture 4 photos">
          <span class="shutter-ring"></span>
          <span class="shutter-dot"></span>
        </button>

        <button class="ctl-btn" id="flipBtn" aria-label="Flip camera">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
            <path d="M21 4v4h-4"/>
            <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
            <path d="M3 20v-4h4"/>
          </svg>
        </button>
      </div>

      <!-- secondary toggles -->
      <div class="toggles">
        <label class="toggle">
          <input type="checkbox" id="soundToggle" checked />
          <span>shutter sound</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="captionToggle" />
          <span>caption</span>
        </label>
        <input type="text" id="captionInput" class="caption-input" maxlength="32" placeholder="add a caption…" />
      </div>
    </section>

    <!-- ============ PROCESSING SCREEN ============ -->
    <section class="screen screen--processing" id="processingScreen" aria-hidden="true">
      <div class="processing-card">
        <div class="loader"></div>
        <p class="loader-text">developing your strip…</p>
      </div>
    </section>

    <!-- ============ PREVIEW SCREEN ============ -->
    <section class="screen screen--preview" id="previewScreen" aria-hidden="true">
      <div class="preview-stage">
        <div class="strip-wrap" id="stripWrap">
          <canvas id="stripCanvas" class="strip-canvas"></canvas>
          <!-- sticker layer -->
          <div class="sticker-layer" id="stickerLayer"></div>
        </div>
      </div>

      <div class="preview-presets">
        <button class="chip active" data-preset="warm">Warm</button>
        <button class="chip" data-preset="pink">Pink</button>
        <button class="chip" data-preset="cool">Cool</button>
        <button class="chip" data-preset="washed">Washed</button>
        <button class="chip" data-preset="bw">B&amp;W</button>
      </div>

      <div class="sticker-tray">
        <button class="sticker-btn" data-sticker="♥">♥</button>
        <button class="sticker-btn" data-sticker="★">★</button>
        <button class="sticker-btn" data-sticker="✦">✦</button>
        <button class="sticker-btn" data-sticker="✿">✿</button>
        <button class="sticker-btn" data-sticker="☾">☾</button>
        <button class="sticker-btn clear" id="clearStickers" aria-label="Clear stickers">⌫</button>
      </div>

      <div class="preview-actions">
        <button class="action-btn ghost" id="retakeBtn">retake</button>
        <button class="action-btn ghost" id="saveBtn">save</button>
        <button class="action-btn primary" id="downloadBtn">download</button>
        <button class="action-btn primary" id="shareBtn">share</button>
      </div>
    </section>

    <!-- ============ GALLERY SCREEN ============ -->
    <section class="screen screen--gallery" id="galleryScreen" aria-hidden="true">
      <div class="gallery-header">
        <button class="ghost-link" id="closeGallery">← back</button>
        <h2>your memories</h2>
        <span class="spacer"></span>
      </div>
      <div class="gallery-grid" id="galleryGrid"></div>
      <p class="empty-msg" id="emptyMsg">no strips yet — go make some memories ✦</p>
    </section>
  </main>

  <!-- Toast -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Hidden audio for shutter -->
  <audio id="shutterAudio" preload="auto"></audio>

  <script src="app.js" type="module"></script>
</body>
</html>
